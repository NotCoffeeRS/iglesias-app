# Configuración de Alembic (migraciones de la base de datos). Se ejecuta desde la carpeta backend/.
#   Subir todo:   alembic upgrade head
#   Deshacer todo: alembic downgrade base

[alembic]
# Carpeta con las migraciones. %(here)s es la carpeta donde está este archivo (backend/).
script_location = %(here)s/alembic

# Agrega backend/ al path de Python para que alembic/env.py pueda hacer `import app`.
prepend_sys_path = %(here)s

# Separador de rutas del sistema operativo. Sin esto Alembic parte las rutas por ":"
# y en Windows rompería "C:\..." (la unidad C: tiene dos puntos).
path_separator = os

# Nombre de cada archivo de migración: <revisión>_<descripción>.
file_template = %%(rev)s_%%(slug)s

# IMPORTANTE: aquí NO se escribe la URL de la base (llevaría la contraseña).
# Se lee de la variable DATABASE_URL (entorno o backend/.env), ver alembic/env.py.

# ---- Registro de mensajes (logging) ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
