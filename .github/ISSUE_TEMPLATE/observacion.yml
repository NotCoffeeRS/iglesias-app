name: Observación o error
description: Registrar un error u observación (sección 14 de la metodología).
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: funcionalidad
    attributes:
      label: Funcionalidad afectada
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - P0-critico — impide usar una funcionalidad indispensable
        - P1-alto — afecta algo indispensable, pero hay forma de evitarlo
        - P2-medio — afecta algo posponible o de forma menor
        - P3-bajo — detalle estético o de conveniencia
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué se esperaba y qué pasó
    validations:
      required: true
